# Material palettes. A design paints with roles (primary, secondary, trim, accent, glass, roof, floor, light); a palette
# names the block each role builds as, so one design can be built from oak early on and from quartz later.
# tier: early (wood, stone, sand: a fresh world), mid (smelting, mining, villages), late (nether, ocean monuments, the end).

[oak]
tier = "early"
description = "Oak logs and planks, spruce roof"
primary = "minecraft:oak_log"
secondary = "minecraft:oak_planks"
trim = "minecraft:stripped_oak_log"
accent = "minecraft:spruce_planks"
glass = "minecraft:glass"
roof = "minecraft:spruce_planks"
floor = "minecraft:oak_planks"
light = "minecraft:torch"

