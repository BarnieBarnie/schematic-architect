[project]
name = "schematic-architect"
version = "0.1.0"
description = "An MCP server that lets an agent design Minecraft schematics from a prompt and export them as .litematic files"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3",
    "nbtlib>=2.0",
    "pillow>=10",
]

[project.scripts]
schematic-architect = "schematic_architect.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "litemapy>=0.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schematic_architect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
